    tip: "Looking back... but at the time... 은 과거 감정과 현재 관점을 대비시키는 AL 급 마무리."
  - id: o048
    tag: 오픽-경험
    kind: speaking
    seconds: 95
    q: "Describe a time when you were really busy at work."
    ko: "직장에서 정말 바빴던 때를 묘사해 주세요."
    structure:
      - "언제, 왜 바빴는지"
      - "얼마나 바빴는지 구체적으로 (시간, 야근)"
      - "어떻게 넘겼고 끝나고 어땠는지"
    phrases:
      - "Last spring we had three projects overlapping at the same time."
      - "I was working late almost every night for about two weeks."
      - "By the time it was over, I was completely drained."
    tip: "completely drained / exhausted / relieved — 감정 형용사 하나가 점수를 만든다."
  - id: o049
    tag: 오픽-경험
    kind: speaking
    seconds: 90
    q: "Tell me about the last time you met your friends. What did you do?"
    ko: "최근에 친구들을 만났던 때를 말해 주세요. 뭘 했나요?"
    structure:
      - "언제, 누구를, 어디서"
      - "한 일을 순서대로"
      - "그날 가장 좋았던 것"
    phrases:
      - "It was a couple of weekends ago."
      - "We met up around six, had dinner, and then went for coffee."
      - "We ended up talking until almost midnight."
    tip: "met up / grabbed dinner / hung out — 구어체 동사를 쓰면 즉시 자연스러워진다."
  - id: o050
    tag: 오픽-경험
    kind: speaking
    seconds: 95
    q: "Talk about a time when a piece of technology broke down. What did you do?"
    ko: "기기가 고장 났던 때에 대해 말해 주세요. 어떻게 했나요?"
    structure:
      - "뭐가 언제 고장 났는지"
      - "그래서 뭐가 곤란했는지"
      - "어떻게 해결했는지 + 배운 것"
    phrases:
      - "My laptop just died on me right in the middle of ..."
      - "The worst part was that I hadn't backed anything up."
      - "In the end I had to take it to a repair shop, and it took about a week."
    tip: "died on me, gave out, stopped working — 고장 표현 셋만 알면 돌발도 막힌다."
  - id: o051
    tag: 오픽-경험
    kind: speaking
    seconds: 95
    q: "Tell me about a memorable experience you had at a restaurant."
    ko: "식당에서 겪은 기억에 남는 일을 말해 주세요."
    structure:
      - "언제, 어디서, 왜 갔는지"
      - "무슨 일이 있었는지 (좋았든 나빴든)"
      - "그 후에 다시 갔는지 / 지금 생각하면"
    phrases:
      - "There was this one time we went to a place that everyone was raving about."
      - "The food took forever to come out, and when it finally did, ..."
      - "We haven't been back since, to be honest."
    tip: "There was this one time... 은 일화를 여는 가장 자연스러운 도입."
  - id: o052
    tag: 오픽-경험
    kind: speaking
    seconds: 90
    q: "Describe a time when the weather caused a problem for you."
    ko: "날씨 때문에 곤란했던 때를 묘사해 주세요."
    structure:
      - "언제, 어떤 날씨였는지"
      - "그래서 무슨 문제가 생겼는지"
      - "어떻게 했는지 + 지금 생각하면"
    phrases:
      - "It was during the rainy season, and it had been pouring for days."
      - "I got completely soaked before I even got to the station."
      - "Ever since then, I always keep an umbrella in my bag."
    tip: "Ever since then, I always... 로 끝내면 경험이 습관으로 이어져 답변이 완결된다."
  - id: o053
    tag: 오픽-경험
    kind: speaking
    seconds: 90
    q: "Tell me about a time you helped someone."
    ko: "누군가를 도왔던 경험을 말해 주세요."
    structure:
      - "누가 어떤 상황이었는지"
      - "내가 무엇을 했는지"
      - "그 사람의 반응 + 내 기분"
    phrases:
      - "A new guy joined our team last year and he was struggling with ..."
      - "So I offered to walk him through it."
      - "He still brings it up sometimes, which is nice."
    tip: "상대의 반응(He said... / He still brings it up)을 넣으면 이야기가 입체적이 된다."

  # --- 오픽-비교 (콤보 세 번째 문항. used to / these days 가 핵심) ---
  - id: o054
    tag: 오픽-비교
    kind: speaking
    seconds: 95
    q: "How has your neighborhood changed since you moved there?"
    ko: "이사 온 뒤로 동네는 어떻게 변했나요?"
    structure:
      - "처음 왔을 때는 어땠는지 (used to)"
      - "무엇이 생기고 무엇이 없어졌는지"
      - "그 변화가 좋은지 나쁜지 내 의견"
    phrases:
      - "When I first moved in, there wasn't much around here."
      - "Over the past few years, they've built a couple of new apartment complexes."
      - "It's more convenient now, but it's also gotten a lot noisier."
    tip: "좋은 점 + 나쁜 점을 함께 말하면 단순 나열이 '평가'가 되어 점수가 오른다."
  - id: o055
    tag: 오픽-비교
    kind: speaking
    seconds: 100
    q: "Compare the way people worked in the past with the way they work now."
    ko: "과거의 일하는 방식과 지금을 비교해 주세요."
    structure:
      - "예전 방식 (종이, 사무실 출근, 긴 회의)"
      - "지금 방식 (디지털, 원격, 메신저)"
      - "무엇이 나아졌고 무엇이 나빠졌는지"
    phrases:
      - "Back in the day, everything had to be printed and signed by hand."
      - "Nowadays, most of it happens over email or messenger."
      - "It's definitely faster, but I'd say people are expected to respond much quicker too."
    tip: "본인 직업 경험으로 답하면 훨씬 구체적이다. 도면·사양서를 실제 예로 들 것."
  - id: o056
    tag: 오픽-비교
    kind: speaking
    seconds: 90
    q: "How is the weather different from when you were a child?"
    ko: "어렸을 때와 지금 날씨는 어떻게 다른가요?"
    structure:
      - "어렸을 때 날씨 (겨울이 더 추웠다 등)"
      - "지금의 변화"
      - "그 변화에 대한 내 생각"
    phrases:
      - "When I was a kid, winters felt a lot colder than they do now."
      - "These days, summer seems to last much longer."
      - "I think it's pretty clearly connected to climate change."
    tip: "감각 비교(felt colder, seems longer)는 사실 확인이 필요 없어 안전하고 자연스럽다."
  - id: o057
    tag: 오픽-비교
    kind: speaking
    seconds: 90
    q: "How has technology changed the way you do your job?"
    ko: "기술이 당신의 업무 방식을 어떻게 바꿨나요?"
    structure:
      - "예전에 어떻게 했는지"
      - "지금 어떤 도구를 쓰는지"
      - "장점과 함께 생긴 부담"
    phrases:
      - "We used to mark up drawings by hand and fax them."
      - "Now everything goes through shared folders and PDF markups."
      - "The downside is that the client expects an answer the same day."
    tip: "The downside is ... 한 문장으로 균형을 잡으면 IH 이상의 인상을 준다."
  - id: o058
    tag: 오픽-비교
    kind: speaking
    seconds: 90
    q: "Compare cafés now and cafés ten years ago."
    ko: "지금의 카페와 10년 전의 카페를 비교해 주세요."
    structure:
      - "예전 카페의 모습과 용도"
      - "지금 카페의 모습과 용도"
      - "왜 그렇게 바뀌었다고 생각하는지"
    phrases:
      - "Ten years ago, cafés were mostly just places to meet someone."
      - "Now you see a lot of people working or studying alone for hours."
      - "I think it's because more people work remotely these days."
    tip: "I think it's because ... 로 이유를 대면 '의견' 점수가 붙는다. 사실일 필요는 없다."

  # --- 오픽-롤플레이 (11~13번. 실제로 전화하듯 말해야 한다) ---
  - id: o059
    tag: 오픽-롤플레이
    kind: speaking
    seconds: 70
    q: "I'll give you a situation. You want to join a gym near your house. Call the gym and ask three questions."
    ko: "상황을 드립니다. 집 근처 헬스장에 등록하려 합니다. 전화해서 세 가지를 질문하세요."
    structure:
      - "인사 + 전화한 이유 (Hi, I'm calling about ...)"
      - "질문 3개를 하나씩 분명하게"
      - "감사 인사로 마무리"
    phrases:
      - "Hi, I'm calling to ask about your membership."
      - "First of all, could you tell me how much it costs per month?"
      - "One more thing — do you have lockers and showers?"
      - "Great, thanks a lot for your help."
    tip: "질문 세 개를 First / Also / One more thing 으로 번호 매기듯 말할 것. 개수를 채우는 게 채점 기준이다."
  - id: o060
    tag: 오픽-롤플레이
    kind: speaking
    seconds: 90
    q: "You bought something online and it arrived damaged. Call the store, explain the problem, and suggest two solutions."
    ko: "온라인 구매품이 파손되어 도착했습니다. 매장에 전화해 문제를 설명하고 두 가지 해결책을 제안하세요."
    structure:
      - "인사 + 주문 확인 정보"
      - "무엇이 어떻게 잘못됐는지 (I'm afraid ...)"
      - "해결책 2개 제안 (교환 / 환불)"
    phrases:
      - "Hi, I'm calling about an order I received yesterday."
      - "I'm afraid the item arrived damaged — there's a crack on the side."
      - "So I was wondering, could you either send me a replacement, or give me a refund?"
      - "Whichever is easier for you would be fine."
    tip: "either A or B 로 두 안을 한 문장에 담는 게 가장 깔끔하다. 이 유형의 정답 패턴."
  - id: o061
    tag: 오픽-롤플레이
    kind: speaking
    seconds: 85
    q: "You need to cancel a reservation. Call the restaurant, explain why, and ask about the cancellation policy."
    ko: "예약을 취소해야 합니다. 식당에 전화해 사유를 설명하고 취소 규정을 물어보세요."
    structure:
      - "예약 정보 확인 (이름, 날짜, 인원)"
      - "취소 사유를 정중하게"
      - "규정 질문 + 사과"
    phrases:
      - "Hi, I have a reservation for this Saturday at seven, under the name ..."
      - "Something came up at work, so unfortunately I need to cancel."
      - "Could you let me know if there's a cancellation fee?"
      - "I'm really sorry for the short notice."
    tip: "Something came up 는 이유를 자세히 말하지 않아도 되는 만능 핑계. 외워 둘 것."
  - id: o062
    tag: 오픽-롤플레이
    kind: speaking
    seconds: 85
    q: "You are running late for an appointment. Call the person, explain the situation, and suggest an alternative."
    ko: "약속에 늦습니다. 상대에게 전화해 상황을 설명하고 대안을 제시하세요."
    structure:
      - "사과 먼저"
      - "왜 늦는지 + 얼마나 늦는지"
      - "대안 제시 (시간 조정 / 장소 변경)"
    phrases:
      - "Hey, I'm so sorry — I'm running a bit late."
      - "The traffic is much worse than I expected. I think I'll be about 20 minutes behind."
      - "Would it work if we pushed it back to seven thirty?"
      - "Or if you'd rather, we could meet somewhere closer to you."
    tip: "Would it work if ...? 는 롤플레이 대안 제시 1순위 표현."
  - id: o063
    tag: 오픽-롤플레이
    kind: speaking
    seconds: 95
    q: "A machine at your workplace stopped working. Call the supplier, explain the problem, and ask what to do."
    ko: "직장의 장비가 멈췄습니다. 공급업체에 전화해 문제를 설명하고 조치를 문의하세요."
    structure:
      - "회사 소개 + 어떤 장비인지"
      - "증상을 구체적으로 (언제부터, 어떤 현상)"
      - "긴급함 전달 + 조치 요청"
    phrases:
      - "Hi, this is ... from ... We purchased a pump unit from you last year."
      - "Since yesterday morning it's been making a strange noise and the pressure keeps dropping."
      - "We really need it back up and running by Monday."
      - "Could you send an engineer out, or at least walk me through what to check?"
    tip: "본인 직업이 그대로 문제로 나온 유형. 실무 덱의 장비 어휘가 여기서 값을 한다."
  - id: o064
    tag: 오픽-롤플레이
    kind: speaking
    seconds: 80
    q: "Your friend is visiting your city. Call and ask three questions about their plan."
    ko: "친구가 당신의 도시를 방문합니다. 전화해서 일정에 대해 세 가지를 물어보세요."
    structure:
      - "반가운 인사"
      - "질문 3개 (언제 / 얼마나 / 뭘 하고 싶은지)"
      - "내가 도울 일 제안"
    phrases:
      - "Hey, I heard you're coming down next month — that's great!"
      - "So when exactly are you arriving, and how long are you staying?"
      - "Is there anything in particular you want to do while you're here?"
      - "Let me know and I'll figure out the rest."
    tip: "친구 상황은 반말 톤(Hey / that's great)으로. 격식체를 쓰면 부자연스럽다."
  - id: o065
    tag: 오픽-롤플레이
    kind: speaking
    seconds: 80
    q: "Now ask me three questions about my job."
    ko: "이번엔 저에게 당신의 직업에 대해 세 가지를 질문해 보세요."
    structure:
      - "질문하겠다는 신호 (So, can I ask you ...)"
      - "질문 3개를 각각 완전한 문장으로"
      - "반응 한마디로 마무리"
    phrases:
      - "Sure, I've got a few things I'm curious about."
      - "First, what exactly do you do at your job?"
      - "And how long have you been working there?"
      - "Last one — what's the best part about it?"
    tip: "'면접관에게 질문하기' 유형. 의문문 어순이 흔들리면 바로 감점. 3개 모두 완전한 문장으로."
  - id: o066
    tag: 오픽-롤플레이
    kind: speaking
    seconds: 90
    q: "You made a reservation but the hotel has no record of it. Explain the situation and ask them to resolve it."
    ko: "예약했는데 호텔에 기록이 없습니다. 상황을 설명하고 해결을 요청하세요."
    structure:
      - "예약 정보 제시 (확인 메일, 날짜, 이름)"
      - "지금 무엇이 문제인지 침착하게"
      - "원하는 해결 + 대안 수용 의사"
    phrases:
      - "I booked a room for tonight and I have the confirmation email right here."
      - "But you're saying there's no record of it? That's a bit of a problem for me."
      - "Is there any chance you could find me a room anyway?"
      - "If not, could you help me find something nearby?"
    tip: "화내지 말 것. 침착한 항의(That's a bit of a problem)가 오히려 고급 표현으로 채점된다."

  # --- 오픽-돌발 (배경설문에 없는 주제. 안 나올 수 없다) ---
  - id: o067
    tag: 오픽-돌발
    kind: speaking
    seconds: 85
    q: "Tell me about public transportation in your country. How do people get around?"
    ko: "당신 나라의 대중교통에 대해 말해 주세요. 사람들은 어떻게 이동하나요?"
    structure:
      - "주요 수단 나열 (지하철, 버스, 택시)"
      - "요금과 편리함 구체적으로"
      - "불편한 점 하나"
    phrases:
      - "The subway system here is really well developed, especially in Seoul."
      - "You just tap your card and it works on both buses and subways."
      - "The only downside is rush hour — it gets unbelievably crowded."
    tip: "돌발 빈출 1위. 지하철·버스·환승·교통카드 네 덩어리만 준비해 두면 된다."
  - id: o068
    tag: 오픽-돌발
    kind: speaking
    seconds: 85
    q: "What do people in your country do to recycle?"
    ko: "당신 나라 사람들은 재활용을 어떻게 하나요?"
    structure:
      - "분리수거가 의무라는 사실"
      - "어떻게 나누는지 구체적으로"
      - "잘 지켜지는지 내 생각"
    phrases:
      - "Recycling is actually mandatory here, so everyone has to separate their trash."
      - "We sort it into paper, plastic, glass, cans, and food waste."
      - "Most people take it pretty seriously, partly because you can get fined."
    tip: "separate / sort / food waste / fined — 이 넷이면 재활용 문항은 끝난다."
  - id: o069
    tag: 오픽-돌발
    kind: speaking
    seconds: 85
    q: "Tell me about banks in your country. How do people usually handle their banking?"
    ko: "당신 나라의 은행에 대해 말해 주세요. 사람들은 보통 어떻게 이용하나요?"
    structure:
      - "예전 방식 (창구 방문)"
      - "지금 방식 (앱, 인터넷뱅킹)"
      - "아직 직접 가야 하는 경우"
    phrases:
      - "Honestly, I can't remember the last time I actually went into a bank."
      - "Almost everything is done through apps these days — transfers, payments, everything."
      - "You really only go in person for things like opening an account."
    tip: "I can't remember the last time I ... 로 시작하면 강한 인상을 준다."
  - id: o070
    tag: 오픽-돌발
    kind: speaking
    seconds: 85
    q: "Describe a hotel you stayed at recently. What was it like?"
    ko: "최근 묵었던 호텔을 묘사해 주세요. 어땠나요?"
    structure:
      - "언제, 어디서, 왜 묵었는지"
      - "방과 시설 묘사"
      - "만족했는지 + 이유"
    phrases:
      - "I stayed at a place in ... when I went there for a business trip."
      - "The room itself was pretty small, but it was clean and the bed was comfortable."
      - "For the price, I'd say it was decent."
    tip: "For the price, ... 같은 평가 기준을 넣으면 단순 묘사가 판단으로 올라간다."
  - id: o071
    tag: 오픽-돌발
    kind: speaking
    seconds: 85
    q: "How do people in your country celebrate holidays?"
    ko: "당신 나라 사람들은 명절을 어떻게 보내나요?"
    structure:
      - "대표 명절 하나를 고른다"
      - "사람들이 하는 일 (귀성, 음식, 의례)"
      - "나는 어떻게 보내는지"
    phrases:
