# 영어 덱 — 목표는 OPIc IH 이상, 덤으로 실무 영어.
#
# 카드는 두 종류다.
#  - kind: word     표현 암기. front 를 보고 back 을 떠올린 뒤 확인한다.
#  - kind: speaking 오픽 실전. 질문을 보고 제한시간 동안 실제로 소리 내어 말한 뒤,
#                   뼈대와 표현을 확인한다. 눈으로 읽기만 하면 점수가 오르지 않는다.
#
# 실무 카드(펌프/도장/검사/메일)는 버리지 않는다. 오픽 배경설문에서 '직장인' 을
# 고르면 직업 관련 문항이 반드시 나오는데, 그때 쓸 재료가 바로 이 어휘들이다.
meta:
  name: OPIc + 실무 영어
  # kind 가 없으면 word(표현 암기). speaking 은 소리 내어 말하는 훈련 카드다.
  tags:
    - 실무-장비
    - 실무-도장
    - 실무-검사
    - 실무-이메일
    - 실무-회의
    - 오픽-표현
    - 오픽-자기소개
    - 오픽-직업
    - 오픽-묘사
    - 오픽-습관
    - 오픽-경험
    - 오픽-비교
    - 오픽-롤플레이
    - 오픽-돌발

cards:
  # --- 실무-장비 (펌프/유압) ---
  - {id: e001, tag: 실무-장비, front: "closed cooling water pump", back: "밀폐 냉각수 펌프", ex: "The closed cooling water pump shall be of the horizontal centrifugal type."}
  - {id: e002, tag: 실무-장비, front: "shaft sealing / mechanical seal", back: "축 밀봉 / 메커니컬 실", ex: "Mechanical seals shall comply with API 682."}
  - {id: e003, tag: 실무-장비, front: "NPSH required / available", back: "필요 흡입수두 / 유효 흡입수두", ex: "NPSHa shall exceed NPSHr by at least 1.0 m."}
  - {id: e004, tag: 실무-장비, front: "rated capacity / total head", back: "정격 유량 / 전양정", ex: "Rated capacity is 250 m3/h at a total head of 45 m."}
  - {id: e005, tag: 실무-장비, front: "impeller / casing / wear ring", back: "임펠러 / 케이싱 / 웨어링", ex: "Wear ring clearance shall be checked at every overhaul."}
  - {id: e006, tag: 실무-장비, front: "relief valve set pressure", back: "릴리프 밸브 설정압", ex: "The relief valve set pressure is 21 MPa."}
  - {id: e007, tag: 실무-장비, front: "hydraulic accumulator (bladder type)", back: "유압 어큐뮬레이터 (블래더형)", ex: "Pre-charge the accumulator with nitrogen to 90 bar."}
  - {id: e008, tag: 실무-장비, front: "directional control valve", back: "방향 제어 밸브", ex: "A 4/3 directional control valve with a closed center is used."}
  - {id: e009, tag: 실무-장비, front: "cavitation", back: "캐비테이션(공동현상)", ex: "Cavitation causes pitting on the impeller vanes."}
  - {id: e010, tag: 실무-장비, front: "lubricant list / lubrication schedule", back: "윤활유 목록 / 급유 주기표", ex: "Please refer to the attached lubricant list, Rev. 2."}
  - {id: e011, tag: 실무-장비, front: "coupling alignment", back: "커플링 정렬", ex: "Coupling alignment shall be within 0.05 mm TIR."}
  - {id: e012, tag: 실무-장비, front: "strainer / suction filter", back: "스트레이너 / 흡입 필터", ex: "Clean the suction strainer before initial start-up."}
  - {id: e013, tag: 실무-장비, front: "vibration severity", back: "진동 허용치", ex: "Vibration severity shall not exceed 4.5 mm/s RMS per ISO 10816."}
  - {id: e014, tag: 실무-장비, front: "duty / standby unit", back: "상용기 / 예비기", ex: "One duty and one standby unit shall be provided."}
  - {id: e015, tag: 실무-장비, front: "local control panel (LCP)", back: "현장 제어반", ex: "The LCP shall have an IP55 enclosure."}

  # --- 실무-도장 (지금 작성 중인 문서군) ---
  - {id: e016, tag: 실무-도장, front: "surface preparation", back: "표면 처리(소지 조정)", ex: "Surface preparation shall be to Sa 2.5 per ISO 8501-1."}
  - {id: e017, tag: 실무-도장, front: "blast cleaning / abrasive blasting", back: "블라스트 세정 / 연마재 분사", ex: "Abrasive blasting is not permitted when humidity exceeds 85%."}
  - {id: e018, tag: 실무-도장, front: "dry film thickness (DFT)", back: "건조도막두께", ex: "The total DFT shall be a minimum of 280 microns."}
  - {id: e019, tag: 실무-도장, front: "primer / intermediate coat / top coat", back: "프라이머 / 중도 / 상도", ex: "Apply the intermediate coat within the recoat interval."}
  - {id: e020, tag: 실무-도장, front: "recoat interval (min / max)", back: "재도장 간격(최소/최대)", ex: "Exceeding the maximum recoat interval requires sweep blasting."}
  - {id: e021, tag: 실무-도장, front: "holiday test / pinhole detection", back: "핀홀 검사", ex: "A holiday test shall be performed on the entire lined surface."}
  - {id: e022, tag: 실무-도장, front: "adhesion test (pull-off)", back: "부착력 시험(인발식)", ex: "Adhesion shall not be less than 5 MPa."}
  - {id: e023, tag: 실무-도장, front: "dew point / substrate temperature", back: "이슬점 / 소지 온도", ex: "The substrate temperature shall be at least 3 degrees above the dew point."}
  - {id: e024, tag: 실무-도장, front: "touch-up / repair coating", back: "부분 보수 도장", ex: "Damaged areas shall be touched up with the same coating system."}
  - {id: e025, tag: 실무-도장, front: "painting data sheet", back: "도장 사양서(데이터시트)", ex: "The painting data sheet for the strainer is enclosed as Attachment 3."}

  # --- 실무-검사/품질 ---
  - {id: e026, tag: 실무-검사, front: "inspection and test plan (ITP)", back: "검사 및 시험 계획서", ex: "Please review the ITP and mark your intervention points."}
  - {id: e027, tag: 실무-검사, front: "witness point / hold point", back: "입회점 / 정지점", ex: "The hydrostatic test is designated as a hold point."}
  - {id: e028, tag: 실무-검사, front: "hydrostatic test", back: "수압 시험", ex: "The casing shall be hydrostatically tested at 1.5 times the design pressure."}
  - {id: e029, tag: 실무-검사, front: "non-conformance report (NCR)", back: "부적합 보고서", ex: "An NCR was issued for the out-of-tolerance bore."}
  - {id: e030, tag: 실무-검사, front: "material test certificate (MTC / EN 10204 3.1)", back: "재질 시험성적서", ex: "MTCs to EN 10204 3.1 shall be submitted for all pressure parts."}
  - {id: e031, tag: 실무-검사, front: "factory acceptance test (FAT)", back: "공장 입회 시험", ex: "FAT is scheduled for the third week of October."}
  - {id: e032, tag: 실무-검사, front: "as-built drawing", back: "준공 도면", ex: "As-built drawings shall be submitted within four weeks after delivery."}
  - {id: e033, tag: 실무-검사, front: "punch list", back: "미결 사항 목록", ex: "All punch list items shall be cleared prior to handover."}
  - {id: e034, tag: 실무-검사, front: "deviation request / concession", back: "사양 변경 요청 / 특채", ex: "We hereby submit a deviation request for the flange rating."}
  - {id: e035, tag: 실무-검사, front: "traceability", back: "추적성", ex: "Heat numbers shall be maintained for full traceability."}

  # --- 실무-이메일 (그대로 복사해 쓸 수 있는 문장) ---
  - {id: e036, tag: 실무-이메일, front: "첨부와 같이 개정본을 송부드립니다.", back: "Please find attached the revised document for your review.", ex: "Rev. 2 반영본 송부 시"}
  - {id: e037, tag: 실무-이메일, front: "아래 건에 대해 확인 부탁드립니다.", back: "Could you please confirm the following?", ex: "짧고 정중한 확인 요청"}
  - {id: e038, tag: 실무-이메일, front: "회신이 늦어 죄송합니다.", back: "I apologize for the delayed reply.", ex: "Sorry for my late reply 보다 격식 있는 표현"}
  - {id: e039, tag: 실무-이메일, front: "일정상 9월 30일까지 회신 주시면 감사하겠습니다.", back: "We would appreciate your reply by September 30 to keep the schedule.", ex: "기한을 압박 없이 명시"}
  - {id: e040, tag: 실무-이메일, front: "귀사의 의견을 반영하여 수정하였습니다.", back: "The document has been revised to reflect your comments.", ex: "코멘트 반영 회신"}
  - {id: e041, tag: 실무-이메일, front: "해당 사항은 당사 공급범위가 아닙니다.", back: "This item falls outside our scope of supply.", ex: "scope of supply = 공급범위"}
  - {id: e042, tag: 실무-이메일, front: "추가 정보가 필요하시면 언제든 연락 주십시오.", back: "Please do not hesitate to contact me should you require any further information.", ex: "격식 있는 맺음말"}
  - {id: e043, tag: 실무-이메일, front: "우선 참고하시도록 초안을 보내드립니다.", back: "I am sending the draft for your reference in the meantime.", ex: "for your reference = 참고용"}
  - {id: e044, tag: 실무-이메일, front: "승인 후 제작에 착수하겠습니다.", back: "We will commence fabrication upon your approval.", ex: "upon approval = 승인 즉시"}
  - {id: e045, tag: 실무-이메일, front: "납기 지연이 우려되어 미리 알려드립니다.", back: "We would like to notify you in advance of a potential delay in delivery.", ex: "선제적 리스크 통보"}
  - {id: e046, tag: 실무-이메일, front: "이전 메일에 이어서 말씀드립니다.", back: "Further to my previous email, ...", ex: "Further to = ~에 이어"}
  - {id: e047, tag: 실무-이메일, front: "담당자를 참조에 추가했습니다.", back: "I have copied our project engineer on this email.", ex: "copy someone on = 참조에 넣다"}
  - {id: e048, tag: 실무-이메일, front: "요청하신 자료는 금주 중 송부 예정입니다.", back: "The requested documents will be issued by the end of this week.", ex: "issue = (공식) 발행·송부"}
  - {id: e049, tag: 실무-이메일, front: "확인 결과 당사 오기였습니다. 정정합니다.", back: "Upon review, this was a typographical error on our side. Please see the corrected version.", ex: "on our side = 당사 측"}
  - {id: e050, tag: 실무-이메일, front: "본 건은 별도 협의가 필요합니다.", back: "This matter requires separate discussion.", ex: "요건 분리 제안"}

  # --- 실무-회의 ---
  - {id: e051, tag: 실무-회의, front: "간단히 배경부터 말씀드리겠습니다.", back: "Let me start with some background.", ex: "발표 도입"}
  - {id: e052, tag: 실무-회의, front: "제가 제대로 이해했는지 확인하고 싶습니다.", back: "I would like to make sure I understand you correctly.", ex: "되묻기 (무례하지 않게)"}
  - {id: e053, tag: 실무-회의, front: "다시 한 번 말씀해 주시겠습니까?", back: "Could you repeat that, please?", ex: "Pardon? 보다 자연스러움"}
  - {id: e054, tag: 실무-회의, front: "그 부분은 확인 후 회신드리겠습니다.", back: "Let me check on that and get back to you.", ex: "즉답 회피 + 책임 있는 마무리"}
  - {id: e055, tag: 실무-회의, front: "요약하면 세 가지입니다.", back: "To summarize, there are three points.", ex: "구조 잡기"}
  - {id: e056, tag: 실무-회의, front: "일정에 영향을 주는 사안입니다.", back: "This has an impact on the schedule.", ex: "have an impact on"}
  - {id: e057, tag: 실무-회의, front: "결론부터 말씀드리면", back: "To get straight to the point, ...", ex: "두괄식 표현"}
  - {id: e058, tag: 실무-회의, front: "합의된 내용을 회의록으로 정리하겠습니다.", back: "I will circulate the minutes of meeting covering what we agreed.", ex: "circulate = 회람하다"}
  - {id: e059, tag: 실무-회의, front: "현실적으로 어렵습니다.", back: "That would be difficult in practice.", ex: "impossible 보다 부드러운 거절"}
  - {id: e060, tag: 실무-회의, front: "대안을 제안드려도 될까요?", back: "May I suggest an alternative?", ex: "제안 도입"}

  # ================= 오픽 =================

  # --- 오픽-표현: 담화 표지와 시간 벌기 ---
  # IH/AL 을 가르는 건 어려운 단어가 아니라 '말이 끊기지 않는 것'이다.
  # 침묵 3초는 감점이지만, 아래 표현으로 채운 3초는 오히려 자연스럽다.
  - {id: o001, tag: 오픽-표현, front: "잠깐만요, 생각 좀 하고요.", back: "Well, let me think for a second.", ex: "침묵 대신 쓰는 1순위 표현. 무조건 외울 것."}
  - {id: o002, tag: 오픽-표현, front: "아, 좋은 질문이네요.", back: "That's a good question, actually.", ex: "시간 벌기 2순위. 자연스럽게 3초를 번다."}
  - {id: o003, tag: 오픽-표현, front: "음, 뭐라고 해야 하지…", back: "Um, how can I put this...", ex: "말문이 막혔을 때. 원어민도 쓴다."}
  - {id: o004, tag: 오픽-표현, front: "사실은 말이죠,", back: "The thing is, ...", ex: "핵심을 꺼낼 때. 문장 앞에 붙이면 말이 한 박자 여유로워진다."}
  - {id: o005, tag: 오픽-표현, front: "제 말은,", back: "What I mean is, ...", ex: "방금 한 말이 어설펐을 때 다시 설명. 자기 부연은 감점이 아니라 가점."}
  - {id: o006, tag: 오픽-표현, front: "아, 생각해 보니까,", back: "Actually, now that I think about it, ...", ex: "말하다가 더 좋은 내용이 떠올랐을 때. AL 급 신호."}
  - {id: o007, tag: 오픽-표현, front: "그러고 보니,", back: "Come to think of it, ...", ex: "과거 경험 문항에서 디테일을 추가할 때."}
  - {id: o008, tag: 오픽-표현, front: "솔직히 말하면,", back: "To be honest with you, ...", ex: "솔직한 감상 = 구체적인 답변. 채점자가 좋아한다."}
  - {id: o009, tag: 오픽-표현, front: "아니, 정확히는", back: "or should I say, ...", ex: "스스로 고쳐 말하기. 고급 화자의 표지다."}
  - {id: o010, tag: 오픽-표현, front: "아, 죄송, ~라는 뜻이에요", back: "Sorry, I mean ...", ex: "틀렸을 때 얼어붙지 말고 이걸로 넘어간다."}
  - {id: o011, tag: 오픽-표현, front: "어디까지 말했죠? 아 맞다,", back: "Anyway, where was I? Oh right, ...", ex: "말이 샜을 때 원래 주제로 복귀."}
  - {id: o012, tag: 오픽-표현, front: "뭐 그런 것들요", back: "...and stuff like that. / ...and things like that.", ex: "열거를 자연스럽게 끝낸다. 문어체 etc. 보다 훨씬 구어답다."}
  - {id: o013, tag: 오픽-표현, front: "좀 ~한 편이에요", back: "It's kind of ... / sort of ...", ex: "단정을 피하는 완충. 남발은 금물, 한 답변에 1~2회."}
  - {id: o014, tag: 오픽-표현, front: "한 ~쯤 되는 것 같아요", back: "I'd say (it's) about ...", ex: "숫자를 말할 때. 정확할 필요 없고 구체적이면 된다."}
  - {id: o015, tag: 오픽-표현, front: "예전에는", back: "Back in the day, ... / Back then, ...", ex: "비교 문항에서 과거로 전환하는 신호탄."}
  - {id: o016, tag: 오픽-표현, front: "요즘은", back: "These days, ... / Nowadays, ...", ex: "비교 문항에서 현재로 전환. Back then 과 짝으로 쓴다."}
  - {id: o017, tag: 오픽-표현, front: "예전엔 ~했는데 지금은 ~해요", back: "I used to ..., but now I ...", ex: "비교 문항 만능 구조. 이 한 문장만 있어도 틀이 잡힌다."}
  - {id: o018, tag: 오픽-표현, front: "그게 다예요 / 뭐 그 정도요", back: "That's pretty much it. / So yeah, that's about it.", ex: "답변 종료 신호. 어정쩡하게 끝내는 것보다 훨씬 낫다."}
  - {id: o019, tag: 오픽-표현, front: "별거 아닌데,", back: "It's not a big deal, but ...", ex: "사소한 일화를 꺼낼 때. 경험 문항 도입으로 좋다."}
  - {id: o020, tag: 오픽-표현, front: "특히 기억나는 건,", back: "What I remember most is ...", ex: "경험 문항에서 클라이맥스로 넘어갈 때."}

  # --- 오픽-자기소개 (1번 문항, 100% 출제) ---
  - id: o021
    tag: 오픽-자기소개
    kind: speaking
    seconds: 60
    q: "Let's start the interview. Tell me a little about yourself."
    ko: "인터뷰를 시작하죠. 본인에 대해 조금 말해 주세요."
    structure:
      - "이름 + 사는 곳 + 직업 한 문장"
      - "무슨 일을 하는지 구체적으로 (회사 이름 말고 하는 일)"
      - "요즘 관심사나 취미 하나로 마무리"
    phrases:
      - "My name is ... and I live in ..."
      - "I work as a mechanical engineer at a company that makes industrial pumps."
      - "Outside of work, I'm really into ..."
