<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" role="img" aria-label="파스칼의 원리에 의한 힘의 증폭과 일의 보존" style="max-width:100%;height:auto" fill="none"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arrА" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-accent, #c4400c)"/></marker></defs><rect x="70" y="120" width="60" height="95" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="74" y="150" width="52" height="61" rx="1" fill="var(--fig-fill, rgba(0,0,0,.05))" stroke="currentColor" stroke-width="1.4"/><line x1="100" y1="90" x2="100" y2="148" stroke="currentColor" stroke-width="2" opacity="1.0"/><rect x="78" y="82" width="44" height="10" rx="1" fill="var(--fig-fill, rgba(0,0,0,.05))" stroke="currentColor" stroke-width="1.4"/><line x1="100" y1="48" x2="100" y2="78" stroke="var(--fig-accent, #c4400c)" stroke-width="2" marker-end="url(#arrА)"/><text x="100" y="40" font-size="12.5" text-anchor="middle" fill="var(--fig-accent, #c4400c)" opacity="1.0" font-weight="600">F₁ = 100 N</text><text x="100" y="232" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="1.0">A₁ = 10 cm²</text><text x="100" y="248" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.65">소경 실린더</text><rect x="370" y="120" width="120" height="95" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="374" y="168" width="112" height="43" rx="1" fill="var(--fig-fill, rgba(0,0,0,.05))" stroke="currentColor" stroke-width="1.4"/><line x1="430" y1="108" x2="430" y2="166" stroke="currentColor" stroke-width="2" opacity="1.0"/><rect x="398" y="100" width="64" height="10" rx="1" fill="var(--fig-fill, rgba(0,0,0,.05))" stroke="currentColor" stroke-width="1.4"/><line x1="430" y1="96" x2="430" y2="66" stroke="var(--fig-accent, #c4400c)" stroke-width="2" marker-end="url(#arrА)"/><text x="430" y="56" font-size="12.5" text-anchor="middle" fill="var(--fig-accent, #c4400c)" opacity="1.0" font-weight="600">F₂ = 1,000 N</text><text x="430" y="232" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="1.0">A₂ = 100 cm²</text><text x="430" y="248" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.65">대경 실린더</text><rect x="130" y="185" width="240" height="26" rx="2" fill="var(--fig-fill, rgba(0,0,0,.05))" stroke="currentColor" stroke-width="1.4"/><text x="250" y="202" font-size="11" text-anchor="middle" fill="currentColor" opacity="1.0">밀폐 작동유   P = 10 N/cm² (전 구간 동일)</text><line x1="146" y1="90" x2="146" y2="148" stroke="currentColor" stroke-width="1" opacity="0.6" stroke-dasharray="3 3"/><line x1="146" y1="148" x2="146" y2="92" stroke="currentColor" stroke-width="1.1" marker-end="url(#arr)"/><text x="152" y="122" font-size="10.5" text-anchor="start" fill="currentColor" opacity="0.8">S₁ = 100 mm</text><line x1="506" y1="108" x2="506" y2="166" stroke="currentColor" stroke-width="1" opacity="0.6" stroke-dasharray="3 3"/><line x1="506" y1="166" x2="506" y2="110" stroke="currentColor" stroke-width="1.1" marker-end="url(#arr)"/><text x="512" y="142" font-size="10.5" text-anchor="start" fill="currentColor" opacity="0.8">S₂ = 10 mm</text><text x="300" y="275" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="1.0" font-weight="600">P = F₁/A₁ = F₂/A₂  →  힘은 면적비만큼 증폭, 행정은 그 역수만큼 감소</text></svg>
