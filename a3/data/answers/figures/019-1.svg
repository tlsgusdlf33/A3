<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 320" role="img" aria-label="복동 실린더의 구조와 헤드측·로드측 면적차에 의한 추력·속도 차이" style="max-width:100%;height:auto" fill="none"><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker><marker id="arrА" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="var(--fig-accent, #c4400c)"/></marker></defs><rect x="90" y="96" width="400" height="104" rx="4" fill="none" stroke="currentColor" stroke-width="1.4"/><rect x="94" y="100" width="392" height="96" rx="2" fill="var(--fig-fill, rgba(0,0,0,.05))" stroke="currentColor" stroke-width="0"/><rect x="292" y="100" width="26" height="96" rx="1" fill="currentColor" stroke="currentColor" stroke-width="0"/><line x1="318" y1="148" x2="588" y2="148" stroke="currentColor" stroke-width="7" opacity="1.0"/><rect x="484" y="132" width="18" height="32" rx="2" fill="none" stroke="currentColor" stroke-width="1.4"/><text x="493" y="122" font-size="9" text-anchor="middle" fill="currentColor" opacity="0.6">로드 패킹</text><rect x="470" y="128" width="12" height="40" rx="2" fill="none" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2"/><text x="458" y="120" font-size="9" text-anchor="end" fill="currentColor" opacity="0.6">와이퍼</text><line x1="60" y1="124" x2="88" y2="124" stroke="var(--fig-accent, #c4400c)" stroke-width="2" marker-end="url(#arrА)"/><text x="56" y="118" font-size="10" text-anchor="end" fill="var(--fig-accent, #c4400c)" opacity="1.0">압유</text><line x1="516" y1="176" x2="544" y2="176" stroke="currentColor" stroke-width="1.6" marker-end="url(#arr)"/><text x="548" y="180" font-size="10" text-anchor="start" fill="currentColor" opacity="0.7">→ 탱크</text><line x1="490" y1="176" x2="516" y2="176" stroke="currentColor" stroke-width="1.6" opacity="1.0"/><line x1="140" y1="100" x2="140" y2="196" stroke="currentColor" stroke-width="1" opacity="0.55" stroke-dasharray="3 3"/><text x="190" y="128" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="1.0" font-weight="600">헤드측 A₁ = πD²/4</text><text x="190" y="146" font-size="10" text-anchor="middle" fill="currentColor" opacity="0.7">면적 大 → 추력 大, 속도 小</text><line x1="400" y1="100" x2="400" y2="140" stroke="currentColor" stroke-width="1" opacity="0.55" stroke-dasharray="3 3"/><line x1="400" y1="156" x2="400" y2="196" stroke="currentColor" stroke-width="1" opacity="0.55" stroke-dasharray="3 3"/><text x="400" y="178" font-size="11" text-anchor="middle" fill="var(--fig-accent, #c4400c)" opacity="1.0" font-weight="600">로드측 A₂ = π(D²−d²)/4</text><line x1="70" y1="96" x2="70" y2="200" stroke="currentColor" stroke-width="1" opacity="0.5"/><line x1="70" y1="148" x2="70" y2="98" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><line x1="70" y1="148" x2="70" y2="198" stroke="currentColor" stroke-width="1" marker-end="url(#arr)"/><text x="62" y="152" font-size="12" text-anchor="end" fill="currentColor" opacity="1.0" font-weight="600">D</text><line x1="560" y1="132" x2="560" y2="164" stroke="currentColor" stroke-width="1" opacity="0.5"/><text x="568" y="152" font-size="12" text-anchor="start" fill="currentColor" opacity="1.0" font-weight="600">d</text><text x="330" y="62" font-size="14" text-anchor="middle" fill="currentColor" opacity="1.0" font-weight="700">F = P · A          v = Q / A</text><text x="330" y="80" font-size="10.5" text-anchor="middle" fill="currentColor" opacity="0.65">추력은 면적에 비례, 속도는 면적에 반비례</text><text x="330" y="244" font-size="11" text-anchor="middle" fill="currentColor" opacity="0.7">D=120 · d=70 · P=32 MPa · Q=150 ℓ/min 일 때</text><text x="180" y="268" font-size="12" text-anchor="middle" fill="currentColor" opacity="1.0" font-weight="600">전진  362 kN · 0.221 m/s</text><text x="480" y="268" font-size="12" text-anchor="middle" fill="var(--fig-accent, #c4400c)" opacity="1.0" font-weight="600">후진  239 kN · 0.335 m/s</text><text x="330" y="292" font-size="11.5" text-anchor="middle" fill="currentColor" opacity="1.0" font-weight="600">면적비 1.52 : 1  →  힘이 큰 쪽은 느리고, 빠른 쪽은 약하다</text></svg>
